# Bot config. No secrets here. Secrets go in secrets.env through bin/add-bot.sh.
# Field reference: docs/reference.md.
enabled = true
prefix = "!"
presence = { status = "online", text = "Online" }   # idle text (default "Online"; idle_status = "..." overrides). Activity replaces it only while the bot is healthy
ignored_events = ["TYPING_START", "PRESENCE_UPDATE"]

# Agent bots: forward Fluxer events to the owner's webhook (the agent's inbox).
# mode: "all" (default: every visible message except the bot's own) | "pings-only" | "pings-and-home"
#       pings-and-home: home_channels get everything, elsewhere only mentions and replies
[[plugins]]
use = "webhook-forward"
mode = "all"
home_channels = []        # messages here are tagged reason = "home"
include_dms = false       # DMs are off by default (unset = false); set true to forward DMs to this bot
include_edits = true      # MESSAGE_UPDATE -> event "edit"
include_deletes = true    # MESSAGE_DELETE -> event "delete" (no content)
include_bots = true       # forward other bots' messages (own messages are never forwarded)
skip_authors = ["self"]
channels = []             # empty = every channel the bot can view
skip_channels = []
batch_seconds = 3
max_per_post = 50
outbox_max = 500
backfill_max = 50
hold = false              # true = queue but do not deliver
events = ["reactions", "member_join", "member_leave", "thread_create"]   # extra gateway events (see README); add "typing", "channels", "bans", ...

# Ignore list. It attaches to the webhook-forward table above. Move it and it attaches to a different plugin.
# Mentions and replies to this bot still pass unless strict = true.
[plugins.ignore]
channels = []             # channel ids; a channel id also covers its threads
users = []                # author user ids
bots = false              # true = drop bot-authored messages, except mentions and replies to this bot
strict = false            # true = ignored channels, users, and bots are dropped even on a mention or reply

# Per-guild policy (optional). forward = "all" | "mentions" | "none"; unset = normal behaviour. See docs/reference.md.
# [guilds."<guild_id>"]
# forward = "mentions"        # only structured @mentions of this bot and replies to its messages
# role_mentions = false       # also count a mention of a role the bot holds
# everyone = false            # also count @everyone / @here
# reactions_to_bot = false    # also forward reactions on this bot's messages
# Per-channel override inside that guild (threads and forum posts inherit from their parent channel):
# [guilds."<guild_id>".channels."<channel_id>"]
# forward = "all"             # every message in this channel, normal mode rules; same keys as the guild table

# Custom status shows Reading, Responding, or Responded. Idle text is presence.text above.
# Health always wins: a degraded or broken bridge still shows that instead. Timings in seconds.
[[plugins]]
use = "activity-status"
reading_seconds = 120          # "Reading <NICK>'s message(s)" after a webhook 2xx, until Responding or this long
responding_seconds = 120       # "Responding to <NICK>'s message" until our reply lands or this long
responded_seconds = 20         # "Responded to <NICK>'s message", then back to idle
min_update_seconds = 2         # presence updates coalesced to at most one per this many seconds
max_updates_per_minute = 12    # and at most this many per rolling minute (hard cap: 4 per 20 s)
typing_means_responding = true # the bot's own typing (POST /channels/<id>/typing) counts as Responding
