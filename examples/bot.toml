# fluxer-agent-bridge bot config (no secrets here; those go in secrets.env via bin/add-bot.sh / bin/set-bot.sh)
# Full reference: README.md "Configuration reference".
enabled = true
prefix = "!"
presence = { status = "online", text = "Relaying" }   # idle text (activity-status shows Reading/Responding/Responded on top)
ignored_events = ["TYPING_START", "PRESENCE_UPDATE"]

# Agent bots: forward Fluxer events to the owner's webhook (the agent's inbox).
# mode: "all" (default: every visible message except the bot's own) | "pings-only" | "pings-and-home"
#       (pings-and-home: home_channels get everything, elsewhere only @-pings/replies)
[[plugins]]
use = "webhook-forward"
mode = "all"
home_channels = []        # messages here are tagged reason = "home"
include_dms = true        # forward DMs (if your instance allows DMs to bots)
include_edits = true      # MESSAGE_UPDATE -> event "edit"
include_deletes = true    # MESSAGE_DELETE -> event "delete" (no content)
include_bots = true       # forward other bots' messages (own messages are never forwarded)
skip_authors = ["self"]
channels = []             # empty = every channel the bot can view
skip_channels = []
batch_seconds = 3
max_per_post = 50
outbox_max = 500
backfill_max = 50
hold = false              # true = queue but do not deliver
events = ["reactions", "member_join", "member_leave", "thread_create"]   # extra gateway events (see README); add "typing", "channels", "bans", ...

# Ignore list (applies to the webhook-forward entry above). Pings/replies to this bot still pass unless strict = true.
[plugins.ignore]
channels = []             # channel ids; a channel id also covers its threads
users = []                # author user ids
bots = false              # true = drop all bot-authored messages (except pings/replies to this bot)
strict = false            # true = ignored channels/users/bots are dropped even when they ping or reply to this bot

# Custom status shows what the bot is doing (Reading / Responding / Responded), idle = presence.text above.
# Health always wins: a degraded or broken bridge still shows that instead. Timings in seconds.
[[plugins]]
use = "activity-status"
reading_seconds = 120          # "Reading <NICK>'s message(s)" after a webhook 2xx, until Responding or this long
responding_seconds = 120       # "Responding to <NICK>'s message" until our reply lands or this long
responded_seconds = 20         # "Responded to <NICK>'s message", then back to idle
min_update_seconds = 2         # presence updates coalesced to at most one per this many seconds
max_updates_per_minute = 12    # and at most this many per rolling minute (hard cap: 4 per 20 s)
typing_means_responding = true # the bot's own typing (POST /channels/<id>/typing) counts as Responding
